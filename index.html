<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a7c6e">
<title>Carnet Calédonie</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1b2422;--mut:#66726f;--ac:#0a7c6e;--acx:#fff;--bd:#dde3e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2321;--tx:#e8eeec;--mut:#92a09c;--ac:#3fc4b0;--acx:#08201c;--bd:#2c3835;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2321;--tx:#e8eeec;--mut:#92a09c;--ac:#3fc4b0;--acx:#08201c;--bd:#2c3835;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 14px 6px}h1{margin:0;font-size:20px}
.sub{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;padding:8px 14px;flex-wrap:wrap}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
button,.btn{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:600;text-decoration:none;display:inline-block;cursor:pointer}
button.alt,.btn.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.chips{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:500}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{padding:0 14px 90px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.card h3{margin:0 0 2px;font-size:17px}.meta{color:var(--mut);font-size:13px}
.note{margin:8px 0;white-space:pre-wrap;word-break:break-word}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
a{color:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:14px 18px;box-shadow:0 4px 14px #0004}
dialog{width:min(520px,94vw);border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);padding:14px}
dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;gap:8px;padding:0 14px 8px}.tabs button{flex:1}
#mw{display:none;position:relative;margin:0 14px 90px;height:calc(100dvh - 250px);min-height:340px;border-radius:14px;overflow:hidden;border:1px solid var(--bd);background:#cfe6ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #mw{background:#1d2d33}}
#map{position:absolute;inset:0;touch-action:none}
#tiles,#sv{position:absolute;inset:0;width:100%;height:100%}#tiles{overflow:hidden}
#sv .land{fill:var(--card);stroke:#8aa08f;stroke-width:1.2}#sv.hasTiles .land{display:none}
#sv text{font:600 12px system-ui,sans-serif;fill:var(--tx);paint-order:stroke;stroke:var(--card);stroke-width:3px}
.nt{position:absolute;left:8px;top:8px;font-size:11px;color:var(--mut);background:var(--card);padding:2px 6px;border-radius:6px}
#sv.hasTiles~.nt{display:none}
.att{position:absolute;right:4px;bottom:2px;font-size:10px;background:#fffc;color:#333;padding:0 4px;border-radius:4px}
.ctl{position:absolute;right:10px;top:10px;display:grid;gap:6px}.ctl button{width:42px;height:42px;padding:0;font-size:20px}
#pc{position:absolute;left:8px;right:8px;bottom:22px;display:none}
</style>
</head>
<body>
<header><h1>🌴 Carnet Calédonie</h1><div class="sub" id="sub"></div></header>
<div class="bar">
<input id="q" placeholder="Rechercher un lieu, une note…" style="flex:1 1 100%">
<button id="loc">📍 Ma position</button>
<button class="alt" id="imp">Importer KML</button>
<button class="alt" id="exp">Exporter KML</button>
<input type="file" id="file" hidden>
</div>
<div class="tabs"><button id="tL">📋 Liste</button><button class="alt" id="tM">🗺️ Carte</button></div>
<div class="chips" id="chips"></div>
<main id="list"></main>
<div id="mw"><div id="map"><div id="tiles"></div><svg id="sv"></svg><div class="nt">Contour schématique (fond de carte indisponible ici)</div></div>
<div class="ctl"><button id="zi">+</button><button id="zo">−</button><button id="zl">📍</button><button id="zf">⤢</button></div>
<div id="pc" class="card"></div><div class="att">© OpenStreetMap contributors</div></div>
<button class="fab" id="add">＋ Ajouter</button>

<dialog id="dlg"><div id="ftitle" style="font-weight:700;font-size:18px">Point d’intérêt</div>
<label>Nom</label><input id="f_name">
<label>Catégorie</label><input id="f_cat" list="cats" placeholder="Plage, Rando, Resto…"><datalist id="cats"></datalist>
<div class="two"><div><label>Latitude</label><input id="f_lat" inputmode="decimal"></div><div><label>Longitude</label><input id="f_lng" inputmode="decimal"></div></div>
<div class="row"><button class="alt" id="f_here" type="button">📍 Utiliser ma position</button></div>
<label>Notes et conseils</label><textarea id="f_note" rows="3"></textarea>
<label>Liens (un par ligne : site, Facebook, Instagram…)</label><textarea id="f_links" rows="3"></textarea>
<div class="two"><div><label>Wi-Fi (nom)</label><input id="f_ssid"></div><div><label>Wi-Fi (mot de passe)</label><input id="f_pwd"></div></div>
<div class="row"><button id="f_ok">Enregistrer</button><button class="alt" id="f_x">Annuler</button><button class="alt" id="f_del" style="margin-left:auto">Supprimer</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const KEY='carnet-nc-v1';
const SEED=[
{id:1,name:'Baie des Citrons (exemple)',cat:'Plage',lat:-22.2915,lng:166.4370,note:'Exemple : plage de Nouméa, restos et bars en bord de mer.',links:'https://www.openstreetmap.org/#map=16/-22.2915/166.4370',ssid:'',pwd:''},
{id:2,name:'Baie de Kuto – Île des Pins (exemple)',cat:'Plage',lat:-22.6560,lng:167.4350,note:'Exemple : sable blanc, baignade calme.',links:'',ssid:'',pwd:''},
{id:3,name:'Parc de la Rivière Bleue (exemple)',cat:'Rando',lat:-22.1500,lng:166.6800,note:'Exemple : sentiers, forêt, kaoris géants.',links:'',ssid:'',pwd:''}];
let P=[],me=null,cat='Tous',editId=null;
try{P=JSON.parse(localStorage.getItem(KEY)||'null')||SEED}catch(e){P=SEED}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dist(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmt=d=>d<1?Math.round(d*1000)+' m':d.toFixed(d<10?1:0)+' km';
function linkify(t){return esc(t).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/,'').slice(0,40)}</a>`)}
function links(t){return String(t||'').split(/\n+/).map(s=>s.trim()).filter(Boolean).map(u=>{u=/^https?:\/\//.test(u)?u:'https://'+u;let h=u;try{h=new URL(u).hostname.replace('www.','')}catch(e){}
const ic=/facebook|fb\.com/.test(h)?'📘':/instagram/.test(h)?'📷':'🌐';return `<a class="btn alt" href="${esc(u)}" target="_blank" rel="noopener">${ic} ${esc(h)}</a>`}).join('')}
function render(){
const cats=['Tous',...new Set(P.map(p=>p.cat).filter(Boolean))];
$('chips').innerHTML=cats.map(c=>`<button class="chip${c===cat?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
$('cats').innerHTML=cats.slice(1).map(c=>`<option value="${esc(c)}">`).join('');
const q=$('q').value.toLowerCase();
let L=P.filter(p=>(cat==='Tous'||p.cat===cat)&&(!q||(p.name+' '+p.note+' '+p.cat).toLowerCase().includes(q)));
if(me)L.forEach(p=>p.d=dist(me,p));L.sort((a,b)=>me?a.d-b.d:a.name.localeCompare(b.name));
shown=L;$('sub').textContent=P.length+' lieu(x)'+(me?' · triés par distance':'');if(view==='map')draw();
$('list').innerHTML=L.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><div class="meta">${esc(p.cat)}${me?' · '+fmt(p.d):''}</div>
${p.note?`<div class="note">${linkify(p.note)}</div>`:''}
<div class="row">${links(p.links)}</div>
<div class="row"><a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=driving" target="_blank" rel="noopener">🧭 Itinéraire</a>
<a class="btn alt" href="geo:${p.lat},${p.lng}?q=${p.lat},${p.lng}(${encodeURIComponent(p.name)})">🗺️ Ouvrir dans une appli carte</a>
<a class="btn alt" href="intent:#Intent;action=android.settings.WIFI_SETTINGS;end">📶 Wi-Fi</a>
${p.ssid?`<button class="alt" data-pw="${p.id}">Copier mot de passe « ${esc(p.ssid)} »</button>`:''}
<button class="alt" data-e="${p.id}">✏️</button></div></div>`).join('')||'<div class="meta">Aucun lieu. Ajoutez-en ou importez un KML.</div>'}
$('chips').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
$('q').oninput=render;
$('list').onclick=e=>{const t=e.target;if(t.dataset.e)openForm(+t.dataset.e);
if(t.dataset.pw){const p=P.find(x=>x.id==t.dataset.pw);navigator.clipboard&&navigator.clipboard.writeText(p.pwd||'').then(()=>{t.textContent='Copié ✓'}).catch(()=>{alert('Mot de passe : '+p.pwd)})}};
function locate(cb){if(!navigator.geolocation)return alert('Géolocalisation indisponible');navigator.geolocation.getCurrentPosition(pos=>{me={lat:pos.coords.latitude,lng:pos.coords.longitude};cb&&cb();render()},()=>alert('Position refusée ou indisponible'),{enableHighAccuracy:true,timeout:15000})}
$('loc').onclick=()=>locate();
function openForm(id){editId=id;const p=P.find(x=>x.id===id)||{name:'',cat:'',lat:'',lng:'',note:'',links:'',ssid:'',pwd:''};
for(const k of ['name','cat','lat','lng','note','links','ssid','pwd'])$('f_'+k).value=p[k];
$('f_del').style.display=id?'':'none';$('dlg').showModal()}
$('add').onclick=()=>openForm(null);
$('f_x').onclick=()=>$('dlg').close();
$('f_here').onclick=()=>locate(()=>{$('f_lat').value=me.lat.toFixed(6);$('f_lng').value=me.lng.toFixed(6)});
$('f_ok').onclick=()=>{const o={};for(const k of ['name','cat','lat','lng','note','links','ssid','pwd'])o[k]=$('f_'+k).value.trim();
o.lat=parseFloat(o.lat.replace(',','.'));o.lng=parseFloat(o.lng.replace(',','.'));
if(!o.name||isNaN(o.lat)||isNaN(o.lng))return alert('Nom, latitude et longitude sont requis');
if(editId){Object.assign(P.find(x=>x.id===editId),o)}else P.push({id:Date.now(),...o});
save();$('dlg').close();render()};
$('f_del').onclick=()=>{if(confirm('Supprimer ce lieu ?')){P=P.filter(x=>x.id!==editId);save();$('dlg').close();render()}};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;let txt;try{if(/\.kmz$/i.test(f.name)||/zip/.test(f.type)){const z=await JSZip.loadAsync(f);const k=Object.keys(z.files).find(n=>/\.kml$/i.test(n));txt=await z.files[k].async('string')}else txt=await f.text()}catch(err){return alert('Fichier illisible')}const x=new DOMParser().parseFromString(txt,'text/xml');let n=0,dup=0;
x.querySelectorAll('Placemark').forEach(m=>{const c=m.querySelector('Point coordinates');if(!c)return;const [lng,lat]=c.textContent.trim().split(',').map(parseFloat);
const g=t=>{const el=m.querySelector(t);return el?el.textContent.trim():''};
const d=g('description').replace(/<[^>]+>/g,' ').trim(),u=(d.match(/https?:\/\/\S+/g)||[]).join('\n');
const ed=k=>{for(const el of m.querySelectorAll('Data')){if(el.getAttribute('name')===k){const v=el.querySelector('value');return v?v.textContent:''}}return null};
const nm=g('name')||'Sans nom';if(P.some(p=>p.name===nm&&Math.abs(p.lat-lat)<1e-5&&Math.abs(p.lng-lng)<1e-5)){dup++;return}
P.push({id:Date.now()+n,name:nm,cat:ed('cat')||'Importé',lat,lng,note:ed('note')!==null?ed('note'):d,links:ed('links')!==null?ed('links'):u,ssid:ed('ssid')||'',pwd:ed('pwd')||''});n++});
save();render();alert(n+' lieu(x) importé(s)'+(dup?', '+dup+' doublon(s) ignoré(s)':''));e.target.value=''};
$('exp').onclick=()=>{const k='<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document>'+P.map(p=>`<Placemark><name>${esc(p.name)}</name><description>${esc((p.note||'')+'\n'+(p.links||''))}</description><ExtendedData>${['cat','note','links','ssid','pwd'].map(k=>`<Data name="${k}"><value>${esc(p[k])}</value></Data>`).join('')}</ExtendedData><Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`).join('')+'</Document></kml>';
const a=document.createElement('a');a.href='data:application/vnd.google-earth.kml+xml;charset=utf-8,'+encodeURIComponent(k);a.download='carnet-caledonie.kml';document.body.appendChild(a);a.click();a.remove()};
/* ===== CARTE ===== */
let shown=[],view='list',sel=null;
const mapEl=$('map'),tl=$('tiles'),sv=$('sv'),M={lat:-21.3,lng:165.6,z:7},clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const OUT=[[[-20.05,163.98],[-20.23,164.0],[-20.56,164.27],[-20.95,164.68],[-21.05,164.85],[-21.34,165.14],[-21.57,165.47],[-21.72,165.78],[-22.02,166.21],[-22.1,166.32],[-22.28,166.43],[-22.2,166.55],[-22.3,166.7],[-22.35,166.88],[-22.4,167.01],[-22.15,166.93],[-21.62,166.22],[-21.52,165.98],[-21.28,165.64],[-21.08,165.4],[-20.93,165.34],[-20.78,165.24],[-20.69,164.98],[-20.39,164.6],[-20.2,164.3]],[[-22.5,167.4],[-22.52,167.55],[-22.65,167.6],[-22.75,167.45],[-22.68,167.35]],[[-21.32,167.95],[-21.4,168.2],[-21.65,168.15],[-21.72,167.95],[-21.55,167.82]],[[-20.75,167.1],[-20.8,167.4],[-21.05,167.35],[-21.15,167.05],[-20.95,166.95]],[[-20.4,166.55],[-20.5,166.62],[-20.72,166.58],[-20.75,166.5],[-20.55,166.5]],[[-19.65,163.55],[-19.72,163.72],[-19.82,163.62],[-19.74,163.52]]];
function px(lat,lng,z){const W=256*2**z,r=lat*Math.PI/180;return[(lng+180)/360*W,(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*W]}
function unpx(x,y,z){const W=256*2**z;return{lng:x/W*360-180,lat:Math.atan(Math.sinh(Math.PI*(1-2*y/W)))*180/Math.PI}}
function toScr(lat,lng){const w=mapEl.clientWidth,h=mapEl.clientHeight,c=px(M.lat,M.lng,M.z),p=px(lat,lng,M.z);return[p[0]-c[0]+w/2,p[1]-c[1]+h/2]}
const tiles={};let raf=0;const sched=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};
function draw(){const w=mapEl.clientWidth,h=mapEl.clientHeight;if(!w)return;
const tz=clamp(Math.round(M.z),2,18),s=2**(M.z-tz),c=px(M.lat,M.lng,tz),n=2**tz,keep={};
const x0=Math.floor((c[0]-w/2/s)/256),x1=Math.floor((c[0]+w/2/s)/256),y0=Math.floor((c[1]-h/2/s)/256),y1=Math.floor((c[1]+h/2/s)/256);
for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){if(y<0||y>=n)continue;const xx=((x%n)+n)%n,k=tz+'/'+xx+'/'+y+'/'+x;keep[k]=1;let im=tiles[k];
if(!im){im=tiles[k]=new Image();im.style.cssText='position:absolute;max-width:none';im.onload=()=>sv.classList.add('hasTiles');im.onerror=()=>{im.style.display='none'};im.src='https://tile.openstreetmap.org/'+tz+'/'+xx+'/'+y+'.png';tl.appendChild(im)}
im.style.left=((x*256-c[0])*s+w/2)+'px';im.style.top=((y*256-c[1])*s+h/2)+'px';im.style.width=im.style.height=(256*s+0.5)+'px'}
for(const k in tiles)if(!keep[k]){tiles[k].remove();delete tiles[k]}
const pt=(a,b)=>toScr(a,b).map(Math.round).join(',');let o='';
OUT.forEach(q=>{o+='<path class="land" d="M'+q.map(p=>pt(p[0],p[1])).join('L')+'Z"/>'});
shown.forEach(p=>{const[x,y]=toScr(p.lat,p.lng);if(x<-20||y<-20||x>w+20||y>h+20)return;o+=`<circle cx="${x}" cy="${y}" r="${p.id===sel?12:9}" fill="var(--ac)" stroke="#fff" stroke-width="2.5"/>`;if(M.z>=9)o+=`<text x="${x+13}" y="${y+4}">${esc(p.name.slice(0,26))}</text>`});
if(me){const[x,y]=toScr(me.lat,me.lng);o+=`<circle cx="${x}" cy="${y}" r="16" fill="#2f7bff33"/><circle cx="${x}" cy="${y}" r="7" fill="#2f7bff" stroke="#fff" stroke-width="2.5"/>`}
sv.innerHTML=o}
function panBy(dx,dy){const c=px(M.lat,M.lng,M.z),q=unpx(c[0]-dx,c[1]-dy,M.z);M.lat=clamp(q.lat,-80,80);M.lng=q.lng}
const ptrs=new Map();let moved=0;
mapEl.onpointerdown=e=>{mapEl.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===1)moved=0};
mapEl.onpointermove=e=>{const o=ptrs.get(e.pointerId);if(!o)return;const n=[e.clientX,e.clientY];
if(ptrs.size===1){moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]);panBy(n[0]-o[0],n[1]-o[1])}
else{const t=[...ptrs.entries()].find(a=>a[0]!==e.pointerId)[1],d0=Math.hypot(o[0]-t[0],o[1]-t[1]),d1=Math.hypot(n[0]-t[0],n[1]-t[1]);moved+=10;if(d0>0)M.z=clamp(M.z+Math.log2(d1/d0),3,18)}
ptrs.set(e.pointerId,n);sched()};
mapEl.onpointerup=mapEl.onpointercancel=e=>{if(moved<8&&ptrs.size===1&&e.type==='pointerup')tap(e);ptrs.delete(e.pointerId)};
mapEl.addEventListener('wheel',e=>{e.preventDefault();M.z=clamp(M.z-e.deltaY*0.002,3,18);sched()},{passive:false});
function tap(e){const r=mapEl.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let b=null,bd=26;
shown.forEach(p=>{const s=toScr(p.lat,p.lng),d=Math.hypot(s[0]-x,s[1]-y);if(d<bd){bd=d;b=p}});
sel=b?b.id:null;const pc=$('pc');if(!b){pc.style.display='none';return sched()}
pc.style.display='block';pc.innerHTML=`<b>${esc(b.name)}</b><div class="meta">${esc(b.cat)}${me?' · '+fmt(dist(me,b)):''}</div>${b.note?`<div class="note" style="max-height:64px;overflow:auto">${linkify(b.note)}</div>`:''}<div class="row"><a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}&travelmode=driving" target="_blank" rel="noopener">🧭 Itinéraire</a><button class="alt" onclick="openForm(${b.id})">✏️</button><button class="alt" onclick="$('pc').style.display='none'">✕</button></div><div class="row">${links(b.links)}</div>`;sched()}
function fit(){const la=shown.map(p=>p.lat),lo=shown.map(p=>p.lng);if(!la.length){M.lat=-21.3;M.lng=165.6;M.z=7;return draw()}
const w=mapEl.clientWidth,h=mapEl.clientHeight;M.lat=(Math.min(...la)+Math.max(...la))/2;M.lng=(Math.min(...lo)+Math.max(...lo))/2;
for(M.z=14;M.z>3;M.z-=0.25){const a=px(Math.max(...la),Math.min(...lo),M.z),b=px(Math.min(...la),Math.max(...lo),M.z);if(Math.abs(b[0]-a[0])<w-80&&Math.abs(b[1]-a[1])<h-120)break}draw()}
